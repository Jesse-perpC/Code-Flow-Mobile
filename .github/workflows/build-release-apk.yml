name: Build Android Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      custom_version_code:
        description: 'Custom Android Version Code (leave empty for automatic ascending)'
        required: false
        type: string
      custom_version_name:
        description: 'Custom Android Version Name (e.g. 1.2.0, leave empty for automatic)'
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build-release-apk:
    name: Build & Package Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full git history to calculate accurate commit count

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Calculate Ascending Version Number
        id: versioning
        run: |
          # Count total commits in the repository history
          COMMIT_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo 1)
          RUN_NUMBER=${{ github.run_number }}
          
          # Strictly ascending Version Code on every commit:
          # Base offset (100) + Commit Count + Run Number ensures monotonic incrementation
          if [ -n "${{ inputs.custom_version_code }}" ]; then
            VERSION_CODE="${{ inputs.custom_version_code }}"
          else
            VERSION_CODE=$(( 100 + COMMIT_COUNT + RUN_NUMBER ))
          fi

          if [ -n "${{ inputs.custom_version_name }}" ]; then
            VERSION_NAME="${{ inputs.custom_version_name }}"
          else
            VERSION_NAME="1.0.${COMMIT_COUNT}"
          fi

          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT

          echo "============================================="
          echo "Building OpenCode DevBox Android Release"
          echo "Commit Count : ${COMMIT_COUNT}"
          echo "Run Number   : ${RUN_NUMBER}"
          echo "Version Code : ${VERSION_CODE}"
          echo "Version Name : ${VERSION_NAME}"
          echo "============================================="

      - name: Configure Release Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${{ github.workspace }}/my-upload-key.jks"

          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "Using release keystore provided via repository secrets."
            echo "${KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_FILE}"
            STORE_PASS="${SECRET_STORE_PASS:-android}"
            KEY_PASS="${SECRET_KEY_PASS:-android}"
          else
            echo "Generating automated upload keystore for CI release build..."
            STORE_PASS="${SECRET_STORE_PASS:-opencode-release-store-pass}"
            KEY_PASS="${SECRET_KEY_PASS:-opencode-release-key-pass}"
            
            keytool -genkeypair -v \
              -keystore "${KEYSTORE_FILE}" \
              -alias "upload" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${STORE_PASS}" \
              -keypass "${KEY_PASS}" \
              -dname "CN=OpenCode CI, OU=Android Release, O=OpenCode, L=San Francisco, ST=CA, C=US"
          fi

          echo "KEYSTORE_PATH=${KEYSTORE_FILE}" >> $GITHUB_ENV
          echo "STORE_PASSWORD=${STORE_PASS}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${KEY_PASS}" >> $GITHUB_ENV

      - name: Build Release APK
        run: |
          echo "Assembling Release APK with VersionCode=${VERSION_CODE} and VersionName=${VERSION_NAME}..."
          gradle :app:assembleRelease \
            -PversionCode="${VERSION_CODE}" \
            -PversionName="${VERSION_NAME}" \
            --stacktrace

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          mkdir -p release-output
          ORIGINAL_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)

          if [ -z "${ORIGINAL_APK}" ]; then
            echo "Error: Release APK not found in build outputs!"
            exit 1
          fi

          RELEASE_APK_NAME="opencode-devbox-v${VERSION_NAME}-b${VERSION_CODE}-release.apk"
          TARGET_APK="release-output/${RELEASE_APK_NAME}"

          cp "${ORIGINAL_APK}" "${TARGET_APK}"
          
          # Generate SHA256 checksum
          cd release-output
          sha256sum "${RELEASE_APK_NAME}" > "${RELEASE_APK_NAME}.sha256"
          APK_SHA=$(cat "${RELEASE_APK_NAME}.sha256" | awk '{print $1}')
          APK_SIZE_BYTES=$(stat -c%s "${RELEASE_APK_NAME}")
          APK_SIZE_MB=$(echo "scale=2; ${APK_SIZE_BYTES} / 1048576" | bc -l 2>/dev/null || echo "$(( APK_SIZE_BYTES / 1048576 ))")
          cd ..

          echo "apk_path=${TARGET_APK}" >> $GITHUB_OUTPUT
          echo "apk_name=${RELEASE_APK_NAME}" >> $GITHUB_OUTPUT
          echo "apk_sha=${APK_SHA}" >> $GITHUB_OUTPUT
          echo "apk_size=${APK_SIZE_MB} MB" >> $GITHUB_OUTPUT

          echo "Release APK packaged: ${TARGET_APK} (${APK_SIZE_MB} MB)"
          echo "SHA256: ${APK_SHA}"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-v${{ env.VERSION_NAME }}-build${{ env.VERSION_CODE }}
          path: |
            release-output/*.apk
            release-output/*.sha256
          retention-days: 30

      - name: Publish GitHub Release (Tagged Commits)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "OpenCode DevBox Release v${{ env.VERSION_NAME }}"
          body: |
            ## OpenCode & DeepSeek Mobile-Harness for Android
            
            ### Release Information
            - **Version Name:** `${{ env.VERSION_NAME }}`
            - **Version Code (Ascending):** `${{ env.VERSION_CODE }}`
            - **Commit SHA:** `${{ github.sha }}`
            - **SHA256 Checksum:** `${{ steps.prepare_artifacts.outputs.apk_sha }}`
            - **APK File Size:** `${{ steps.prepare_artifacts.outputs.apk_size }}`
            
            ### Included Capabilities
            - Real OpenCode autonomous AI coding agent (`anomalyco/opencode`)
            - Real DeepSeek Mobile-Harness evaluation testbed (`techjarves/Mobile-Harness`)
            - Integrated HTTP Code Server (Port 8080) & SSH Server (Port 2222)
            - Interactive UNIX terminal with Git, Node, Python, and system utilities
            - AES-256-GCM encrypted peer synchronization
          files: |
            release-output/*.apk
            release-output/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output Job Summary
        run: |
          echo "### 🚀 Android Release APK Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version Name** | \`${{ env.VERSION_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version Code (Ascending)** | \`${{ env.VERSION_CODE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Package Name** | \`com.aistudio.codeserver.devbox\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **APK Size** | \`${{ steps.prepare_artifacts.outputs.apk_size }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **SHA256** | \`${{ steps.prepare_artifacts.outputs.apk_sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK under the **Artifacts** tab on this workflow run." >> $GITHUB_STEP_SUMMARY
